<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>Edit Survey | Survey Kori</title>
        <link rel="stylesheet" href="../assets/css/style.css">
        <link rel="stylesheet" href="../assets/css/components.css">
        <link rel="stylesheet" href="../assets/css/responsive.css">
    </head>
    <body>
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
                <a class="brand" href="../notification.html">Notifications <span class="dot">3</span></a>
                <span class="nav-user">Rahim Uddin</span>
                <a class="btn btn-outline btn-sm" href="../index.html">Logout</a>
            </div>
        </header>
        <div class="layout">
            <aside class="sidebar" id="sidebar">
                <nav>
                    <a class="side-link" href="../dashboard.html">Dashboard</a>
                    <a class="side-link" href="../survey/find.html">Find Surveys</a>
                    <a class="side-link" href="../survey/my-surveys.html">My Surveys</a>
                    <a class="side-link" href="../survey/create.html">Create Survey</a>
                    <a class="side-link" href="../points/index.html">Point Center</a>
                    <a class="side-link" href="../notifications.html">Notifications</a>
                    <a class="side-link" href="../profile.html">Profile</a>
                    <a class="side-link" href="../admin/index.html">Admin Panel</a>
                    <a class="side-link" href="../index.html">Logout</a>
                </nav>
            </aside>
            <main class="content">
                <h1>Edit Survey Information</h1>

                <div class="card" style="max-width:660px">
                    <form action="builder.html">
                        <div class="form-group">
                            <label>Title</label>
                            <input class="input" type="text" name="title" value="Studnet Study Habits 2026" required>
                
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="textarea" name="description" required>A short survey about the daily habits of university students.</textarea>

                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select class="select" name="category">
                                <option value="Education" selected>Education</option>
                                <option value="Health">Health</option>
                                <option value="Technology">Technology</option>
                                <option value="Business">Business</option>
                                <option value="Social">Social</option>
                                <option value="Environment">Environment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>Required Response</label>
                                <input class="input" type="number" min="1" name="required_responses" value="20" required>

                            </div>
                            <div class="form-group">
                                <label for="">Reward Per Response</label>
                                <input class="input" type="number" min="1" name="reward_per_response" value="5" required>
                            </div>
                         </div>
                            <div class="form-group">
                                <label>Deadline</label>
                                <input class="input" type="date" name="deadline" value="2026-09-30" required>

                            </div>
                            <div class="row">
                                <button class="btn btn-primary" type="submit">Save</button>
                                <a class="btn btn-outline" href="builder.html">Back to Questions</a>
                            </div>
                        
                    </form>
                </div>
            </main>
        </div>
        <footer class="footer">
            <p>Survey Kori &mdash; University Web Technology Project</p>
        </footer>
        <script src="../assets/js/script.js"></script>
    </body>
</html>
