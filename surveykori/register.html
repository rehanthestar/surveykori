<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Survey Kori</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="public-nav">
        <a class="brand" href="index.html">Survey<span>Kori</span></a>
        <a class="btn btn-primary btn-sm" href="login.html">Login </a>
    </div>

    <div class="auth-box">
    <h1>Create Account</h1>

    <form action="login.html">

        <div class="form-group">
            <label for="">Full Name</label>
            <input  class="input" type="text" name="full_name" required>
        </div>
        <div class="form-group">
            <label for="">Email</label>
            <input  class="input" type="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="">Password</label>
            <input  class="input" type="password" name="password" required>
            <p class="help-text">at least 6 character</p>
        </div>
        <div class="form-group">
            <label for="">Confirm Password</label>
            <input  class="input" type="password" name="confirm_password" required>
        </div>
        <div class="form-group">
            <label for="">University</label>
            <input  class="input" type="text" name="university" required>
        </div>
        <div class="form-group">
            <label for="">Department</label>
            <input  class="input" type="text" name="department" required>
        </div>
        <div class="form-group">
            <label for="">User Type</label>
            <select class="select" name="user_type" id="">

                <option value="student">Student</option>
                <option value="researcher">Researcher</option>
            </select>
        </div>


        
        <button class="btn-orimary btn btn-block" type="submit">Register</button>
    </form>


    <p class="small mt">already have an account <a href="login.html">Register Here</a></p>
</div>
    
</body>
</html>
