<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Kori - Point Based Survey Exchange for Students</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="public-nav">
    
    <div class="row">
        <a class="brand" href="index.html">Survey<span>Kori</span></a>
        <a class="btn btn-primary btn-sm" href="register.html">Register</a>
    </div>
</nav>

<div class="auth-box">
    <h1>Login</h1>
    <p class="text-muted small">Use your survey kori account</p>

    <form action="dashboard.html">

        <div class="form-group">
            <label for="">Email</label>
            <input type="email" class="input" name="email" required>
        </div>
        <div class="form-group">
            <label for="">Password</label>
            <input type="password" class="input" name="password" required> 
        </div>

        <button class="btn-orimary btn btn-block" type="submit">Login</button>
    </form>


    <p class="small mt">No Account <a href="register.html">Register Here</a></p>
    <p class="small mt">Admin? <a href="admin/login.html">Admin Login</a></p>
</div>
    
</body>
</html>
