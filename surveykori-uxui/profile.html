<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Survey Kori</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-left">
            <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
            <a class="brand" href="dashboard.html">Survey<span>Kori</span></a>
        </div>
    </header>

    <div class="navbar-right">
        <a class="nav-link" href="notifications.html">Notifications <span class="dot">3</span></a>
        <span class="nav-user">Rahim Uddin</span>
        <a class="btn btn-outline btn-sm" href="index.html">Logout</a>
    </div>


    <div class="layout">
        <aside class="sidebar" id="sidebar">

            <nav>
                <a class="side-link is-active" href="dashboard.html" >Dashboard</a>
                <a class="side-link" href="" >Fidn Survey</a>
                <a class="side-link" href="" >My Survey</a>
                <a class="side-link" href="" >Create Survey</a>
                <a class="side-link" href="" >Point Center</a>
                <a class="side-link" href="" >Notifications</a>
                <a class="side-link" href="" >Profile</a>
                <a class="side-link" href="" >Admin panel</a>
                <a class="side-link" href="" >Logout</a>
            </nav>
        </aside>


        <main class="content">
            <h1>my profile</h1>
            <div class="grid-2">
                <div class="card">
                    <h3>profil info</h3>

                    <form action="">

                        <div class="form-group">
                            <label for="">Full Name</label>
                            <input type="text" class="input" name="full_name" value="Rahi Uddin" required>
                        </div>
                        <div class="form-group">
                            <label for="">Email ( Cannot Change )</label>
                            <input type="email" class="input" name="email" value="rahim@aiub.edu" disable>
                        </div>

                        <div class="form-group">
                            <label for="">University</label>
                            <input type="text" class="input" name="university" value="AIUB" required>
                        </div>
                        <div class="form-group">
                            <label for="">Department</label>
                            <input type="text" class="input" name="department" value="CSE" required>
                        </div>

                        <div class="form-group">
                            <label for="">User Type</label>
                            <select class="select" name="user_type" id="">
                                <option value="student" selected> Student</option>
                                <option value="researcher" > Research</option>
                            </select>
                        </div>

                        <button class="btn btn-primary " type="button">Save Changes</button>
                        


                    </form>
                </div>



                <div class="card">

                    <h3>Change Password</h3>

                    <form action="">
                        <div class="form-group">
                            <label for="">Current Password</label>
                            <input type="password" class="input" name="old_password" required>
                        </div>
                        <div class="form-group">
                            <label for="">New Password</label>
                            <input type="password" class="input" name="new_password" required>
                        </div>
                        <div class="form-group">
                            <label for="">Confirm New Password</label>
                            <input type="password" class="input" name="confirm_password" required>
                        </div>

                        <button type="button" class="btn-secondary btn">Update pass</button>

                        <p class="small text-muted mt">Member since 10 Aug 2026</p>



                    </form>
                </div>
            </div>


        </main>
    </div>

    <footer class="footer">
        <p>Survey Kori &mdash; University Web Technology Project</p>

    </footer>
<script src="assets/js/script.js"></script>
</body>
</html>
